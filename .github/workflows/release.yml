name: Release
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick the version
        id: version
        run: |
          version="$(scripts/next-version.sh "${{ inputs.bump || 'auto' }}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Test
        if: steps.version.outputs.version != ''
        run: make test
      # Signing every release with the same certificate makes macOS see updates as the same app,
      # so they keep the Accessibility permission. Ad hoc signatures change with every build.
      - name: Load the signing certificate
        id: signing
        if: steps.version.outputs.version != ''
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [[ -z "$CERT_P12" ]]; then
            echo "::warning::SIGNING_CERT_P12 is not set, so this release is signed ad hoc and updates will ask for Accessibility again."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # codesign only finds the self-signed identity when its keychain is in the search list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          echo "identity=Tooki Release Signing" >> "$GITHUB_OUTPUT"


      - name: Build universal Tauri DMG
        if: steps.version.outputs.version != ''
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          TAURI_TARGET: universal-apple-darwin
        run: |
          make dmg
          codesign --verify --deep --strict build/Tooki.app
          lipo -verify_arch arm64 x86_64 build/Tooki.app/Contents/MacOS/tooki
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' build/Tooki.app/Contents/Info.plist)" = 'us.tahsin.tooki'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/Tooki.app/Contents/Info.plist)" = "$VERSION"
      - name: Preserve the final Swift update feed
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/legacy-feed
          gh release download v0.11.0 --pattern appcast.xml --dir build/legacy-feed
      - name: Publish release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          range="${previous:+$previous..}HEAD"
          {
            echo 'Tooki now uses its Rust/Tauri implementation. The Swift sources are preserved in .playground/tooki-swift.'
            echo
            echo 'Includes clipboard history, snippets, emoji, notes, Keep Awake, Hyper Key, Shortcut Detective and the Shelferry integration.'
            echo
            echo 'Install or replace the Swift app with `brew update && brew reinstall --cask tahsinature/tap/tooki`.'
            echo 'Future updates use Homebrew. This version does not include the Swift menu bar organizer or Sparkle updater.'
            echo 'Existing Swift settings, snippets, clipboard history and shelves remain untouched; they are not automatically imported.'
            echo 'Shelf operations require the standalone Shelferry app: `brew install --cask tahsinature/tap/shelferry`.'
            echo
            echo '## Changes'
            git log "$range" --no-merges --format='- %s (%h)'
          } > "$RUNNER_TEMP/tooki-release-notes.md"
          gh release create "v$VERSION" build/Tooki.dmg build/legacy-feed/appcast.xml --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/tooki-release-notes.md"
      - name: Update Homebrew cask
        if: steps.version.outputs.version != ''
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo '::error::HOMEBREW_TAP_TOKEN is required to publish the cask.'
            exit 1
          fi
          sha="$(shasum -a 256 build/Tooki.dmg | cut -d ' ' -f 1)"
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/tahsinature/homebrew-tap.git" "$RUNNER_TEMP/tooki-tap"
          sed -e "s/^  version \".*\"/  version \"$VERSION\"/" \
              -e "s/^  sha256 \".*\"/  sha256 \"$sha\"/" \
              packaging/tooki.rb > "$RUNNER_TEMP/tooki-tap/Casks/tooki.rb"
          cd "$RUNNER_TEMP/tooki-tap"
          git config user.name 'Tahsin'
          git config user.email '41298152+tahsinature@users.noreply.github.com'
          git add Casks/tooki.rb
          git commit -m "tooki $VERSION"
          git push
