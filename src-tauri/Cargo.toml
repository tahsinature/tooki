[package]
name = "tooki"
version = "0.12.0"
edition = "2021"
[build-dependencies]
cc = "1.11.2"
tauri-build = { version = "2", features = [] }
[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
semver = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.23.1"
rusqlite = { version = "0.43.0", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2.1.1"
tauri-plugin-global-shortcut = "2"
shortcut-detective = { path = "crates/shortcut-detective" }
hyper-key = { path = "crates/hyper-key" }

tokio = { version = "1", features = ["time", "process", "sync", "macros", "rt"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy", "zip"] }

[dev-dependencies]
minisign-verify = "0.3"
